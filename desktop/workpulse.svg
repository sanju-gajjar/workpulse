<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="#4A90D9"/>
  
  <!-- Mascot body (blob shape) -->
  <ellipse cx="24" cy="28" rx="14" ry="12" fill="#FFD93D"/>
  
  <!-- Cute face -->
  <!-- Left eye -->
  <ellipse cx="19" cy="26" rx="3" ry="4" fill="white"/>
  <circle cx="19" cy="26" r="2" fill="#333"/>
  <circle cx="18" cy="25" r="0.8" fill="white"/>
  
  <!-- Right eye -->
  <ellipse cx="29" cy="26" rx="3" ry="4" fill="white"/>
  <circle cx="29" cy="26" r="2" fill="#333"/>
  <circle cx="28" cy="25" r="0.8" fill="white"/>
  
  <!-- Happy smile -->
  <path d="M 18 32 Q 24 38 30 32" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Blush -->
  <ellipse cx="14" cy="30" rx="2" ry="1.5" fill="#FF9999" opacity="0.6"/>
  <ellipse cx="34" cy="30" rx="2" ry="1.5" fill="#FF9999" opacity="0.6"/>
  
  <!-- Clock above head -->
  <circle cx="24" cy="12" r="6" fill="white" stroke="#333" stroke-width="1"/>
  <line x1="24" y1="12" x2="24" y2="9" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="12" x2="27" y2="12" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Sparkle -->
  <path d="M 38 8 L 39 10 L 41 11 L 39 12 L 38 14 L 37 12 L 35 11 L 37 10 Z" fill="white"/>
</svg>
